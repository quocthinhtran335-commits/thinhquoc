<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minh họa dự án tra cứu thời tiết: khung trình duyệt với biểu tượng mặt trời, mây và các cột nhiệt độ">
